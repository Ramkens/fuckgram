name: Build fuckgram APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build (comma separated). arm64-v8a is enough for modern phones"
        default: "arm64-v8a"
      minify:
        description: "Run R8 minify (slower, smaller APK)"
        type: boolean
        default: false
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FG_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
  FG_MINIFY: ${{ github.event.inputs.minify || 'false' }}

jobs:
  # Runs in parallel with the native build: fails fast on Java / resource errors.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Java and resources
        run: |
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac \
            -PfgAbis="$FG_ABIS" --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FG_API_ID: ${{ secrets.FG_API_ID }}
      FG_API_HASH: ${{ secrets.FG_API_HASH }}
      FG_KEYSTORE_B64: ${{ secrets.FG_KEYSTORE_B64 }}
      FG_KEYSTORE_PASSWORD: ${{ secrets.FG_KEYSTORE_PASSWORD }}
    steps:
      - name: Require secrets (fails fast)
        run: |
          missing=""
          for v in FG_API_ID FG_API_HASH FG_KEYSTORE_B64 FG_KEYSTORE_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          case "$FG_API_ID" in (*[!0-9]*|'') echo "::error::FG_API_ID must be digits only"; exit 1;; esac
          echo "$FG_API_HASH" | grep -Eq '^[0-9a-f]{32}$' || { echo "::error::FG_API_HASH must be 32 hex chars"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" &
          wait
          df -h / | tail -1; nproc; free -g | head -2

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Inject API credentials and signing key
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s|public static int APP_ID = 0;|public static int APP_ID = ${FG_API_ID};|" "$F"
          sed -i "s|public static String APP_HASH = \"\";|public static String APP_HASH = \"${FG_API_HASH}\";|" "$F"
          sed -i "s/FUCKGRAM_VERSION = \"[^\"]*\"/FUCKGRAM_VERSION = \"$(tr -d '[:space:]' < VERSION)\"/" "$F"
          grep -q "APP_ID = ${FG_API_ID};" "$F" || { echo "::error::APP_ID injection failed"; exit 1; }
          echo "$FG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fuckgram.jks"
          echo "FG_KEYSTORE_FILE=$RUNNER_TEMP/fuckgram.jks" >> "$GITHUB_ENV"
          echo "FG_KEY_ALIAS=fuckgram" >> "$GITHUB_ENV"

      # ccache: unchanged C++ files are not recompiled on the next build
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ env.FG_ABIS }}
          max-size: 2G

      - name: Build release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: "string:ndk-27.2.12479018"
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
        run: |
          EXTRA=""
          if [ "$FG_MINIFY" != "true" ]; then EXTRA="-PfgNoMinify"; fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -PfgAbis="$FG_ABIS" $EXTRA --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - uses: actions/upload-artifact@v4
        with:
          name: fuckgram-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: fuckgram-apk
          path: apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          NAME="fuckgram-${VERSION}.apk"
          cp apk/app.apk "$NAME"
          # release notes = the section of CHANGELOG.md for this version
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo "## fuckgram $VERSION"
            echo
            cat notes.md
            echo
            echo "---"
            echo "**Установка:** скачайте \`$NAME\` ниже, разрешите установку из неизвестных источников и откройте файл. Работает рядом с официальным Telegram."
            echo
            echo "**Install:** download \`$NAME\` below, allow installing unknown apps, open it. It runs next to the official Telegram."
            echo
            echo "Неофициальный клиент на основе Telegram for Android 13.2.2 (GPLv2). Автор: @scamchrome. / Unofficial client based on Telegram for Android 13.2.2 (GPLv2). Creator: @scamchrome. Source: this repository at tag \`v$VERSION\`."
          } > body.md
          # one release per version and no old builds lying around
          for old in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
          gh release create "v$VERSION" "$NAME" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "fuckgram $VERSION" --notes-file body.md --latest
